<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - StreamVibe</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-lg);
      background: linear-gradient(135deg, var(--bg-primary) 0%, #1a0a1a 100%);
    }

    .auth-box {
      background: var(--bg-secondary);
      border-radius: var(--radius-xl);
      padding: var(--spacing-2xl);
      max-width: 450px;
      width: 100%;
      box-shadow: var(--shadow-xl);
    }

    .auth-logo {
      text-align: center;
      margin-bottom: var(--spacing-xl);
    }

    .auth-logo-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: var(--radius-lg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      color: white;
      margin-bottom: var(--spacing-md);
    }

    .auth-title {
      font-size: 1.75rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: var(--spacing-sm);
    }

    .auth-subtitle {
      text-align: center;
      color: var(--text-secondary);
      margin-bottom: var(--spacing-xl);
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      margin: var(--spacing-xl) 0;
      color: var(--text-tertiary);
      font-size: 0.875rem;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-color);
    }

    .auth-link {
      text-align: center;
      margin-top: var(--spacing-lg);
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .auth-link a {
      color: var(--primary);
      font-weight: 500;
    }

    .auth-link a:hover {
      text-decoration: underline;
    }

    .social-login {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-lg);
    }

    .social-btn {
      padding: var(--spacing-sm) var(--spacing-md);
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-sm);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .social-btn:hover {
      background: var(--bg-hover);
      border-color: var(--text-secondary);
    }

    .terms-text {
      font-size: 0.85rem;
      color: var(--text-tertiary);
      margin-bottom: var(--spacing-lg);
      line-height: 1.5;
    }

    .terms-text a {
      color: var(--primary);
    }

    .password-strength {
      margin-top: var(--spacing-sm);
    }

    .strength-bar {
      height: 4px;
      background: var(--bg-tertiary);
      border-radius: var(--radius-full);
      overflow: hidden;
      margin-bottom: var(--spacing-xs);
    }

    .strength-fill {
      height: 100%;
      transition: all var(--transition-base);
      border-radius: var(--radius-full);
    }

    .strength-text {
      font-size: 0.75rem;
      color: var(--text-tertiary);
    }
  </style>
</head>
<body>
  <div class="auth-container fade-in">
    <div class="auth-box scale-in">
      <div class="auth-logo">
        <div class="auth-logo-icon">SV</div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join StreamVibe and start sharing your videos</p>
      </div>

      <!-- Social Login -->
      <div class="social-login">
        <button class="social-btn" onclick="socialLogin('google')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Google
        </button>
        <button class="social-btn" onclick="socialLogin('github')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
          </svg>
          GitHub
        </button>
      </div>

      <div class="auth-divider">
        <span>or sign up with email</span>
      </div>

      <!-- Signup Form -->
      <form id="signupForm" onsubmit="handleSignup(event)">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input
            type="text"
            id="username"
            class="form-input"
            placeholder="johndoe"
            pattern="[a-zA-Z0-9_]{3,20}"
            title="3-20 characters, letters, numbers, and underscore only"
            required
          >
          <p class="form-help">3-20 characters, letters, numbers, and underscore only</p>
        </div>

        <div class="form-group">
          <label class="form-label" for="displayName">Display Name</label>
          <input
            type="text"
            id="displayName"
            class="form-input"
            placeholder="John Doe"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="you@example.com"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="Create a strong password"
            minlength="8"
            oninput="checkPasswordStrength()"
            required
          >
          <div class="password-strength">
            <div class="strength-bar">
              <div class="strength-fill" id="strengthFill"></div>
            </div>
            <div class="strength-text" id="strengthText">Enter a password</div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-checkbox">
            <input type="checkbox" id="terms" required>
            <span class="terms-text">
              I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
            </span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg">
          <span id="signupBtnText">Create Account</span>
          <div class="spinner hidden" id="signupSpinner"></div>
        </button>
      </form>

      <div class="auth-link">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function checkPasswordStrength() {
      const password = document.getElementById('password').value;
      const fill = document.getElementById('strengthFill');
      const text = document.getElementById('strengthText');

      let strength = 0;
      let strengthText = '';
      let color = '';

      if (password.length >= 8) strength++;
      if (password.match(/[a-z]/)) strength++;
      if (password.match(/[A-Z]/)) strength++;
      if (password.match(/[0-9]/)) strength++;
      if (password.match(/[^a-zA-Z0-9]/)) strength++;

      switch (strength) {
        case 0:
        case 1:
          strengthText = 'Weak';
          color = '#EF4444';
          break;
        case 2:
        case 3:
          strengthText = 'Medium';
          color = '#F59E0B';
          break;
        case 4:
          strengthText = 'Strong';
          color = '#10B981';
          break;
        case 5:
          strengthText = 'Very Strong';
          color = '#10B981';
          break;
      }

      const width = (strength / 5) * 100;
      fill.style.width = width + '%';
      fill.style.background = color;
      text.textContent = strengthText;
      text.style.color = color;
    }

    async function handleSignup(event) {
      event.preventDefault();

      const username = document.getElementById('username').value;
      const displayName = document.getElementById('displayName').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const btnText = document.getElementById('signupBtnText');
      const spinner = document.getElementById('signupSpinner');
      const form = document.getElementById('signupForm');

      // Show loading state
      btnText.classList.add('hidden');
      spinner.classList.remove('hidden');
      form.querySelectorAll('input').forEach(input => input.disabled = true);

      try {
        const response = await api.post('/auth/register', {
          username,
          displayName,
          email,
          password
        });

        if (response.success) {
          // Store token
          localStorage.setItem('token', response.data.token);
          localStorage.setItem('user', JSON.stringify(response.data.user));

          // Show success message
          showNotification('Account created successfully! Redirecting...', 'success');

          // Redirect to homepage
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1000);
        }
      } catch (error) {
        // Show error message
        showNotification(error.message || 'Signup failed. Please try again.', 'error');

        // Reset form state
        btnText.classList.remove('hidden');
        spinner.classList.add('hidden');
        form.querySelectorAll('input').forEach(input => input.disabled = false);
      }
    }

    function socialLogin(provider) {
      showNotification(`${provider} signup coming soon!`, 'info');
    }

    function showNotification(message, type) {
      const notification = document.createElement('div');
      notification.className = `alert alert-${type} notification-enter`;
      notification.style.position = 'fixed';
      notification.style.top = '20px';
      notification.style.right = '20px';
      notification.style.zIndex = '9999';
      notification.style.minWidth = '300px';
      notification.innerHTML = `
        <div class="alert-content">
          <div>${message}</div>
        </div>
      `;

      document.body.appendChild(notification);

      setTimeout(() => {
        notification.classList.add('notification-exit');
        setTimeout(() => notification.remove(), 300);
      }, 3000);
    }
  </script>
</body>
</html>
