<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - StreamVibe</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-lg);
      background: linear-gradient(135deg, var(--bg-primary) 0%, #1a0a1a 100%);
    }

    .auth-box {
      background: var(--bg-secondary);
      border-radius: var(--radius-xl);
      padding: var(--spacing-2xl);
      max-width: 450px;
      width: 100%;
      box-shadow: var(--shadow-xl);
    }

    .auth-logo {
      text-align: center;
      margin-bottom: var(--spacing-xl);
    }

    .auth-logo-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: var(--radius-lg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      color: white;
      margin-bottom: var(--spacing-md);
    }

    .auth-title {
      font-size: 1.75rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: var(--spacing-sm);
    }

    .auth-subtitle {
      text-align: center;
      color: var(--text-secondary);
      margin-bottom: var(--spacing-xl);
      line-height: 1.6;
    }

    .auth-link {
      text-align: center;
      margin-top: var(--spacing-lg);
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .auth-link a {
      color: var(--primary);
      font-weight: 500;
    }

    .auth-link a:hover {
      text-decoration: underline;
    }

    .success-message {
      text-align: center;
      padding: var(--spacing-xl);
    }

    .success-icon {
      width: 64px;
      height: 64px;
      background: var(--success);
      border-radius: var(--radius-full);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: white;
      margin-bottom: var(--spacing-md);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: var(--spacing-sm);
      color: var(--text-secondary);
      margin-bottom: var(--spacing-xl);
      transition: color var(--transition-fast);
    }

    .back-link:hover {
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <div class="auth-container fade-in">
    <div class="auth-box scale-in">
      <a href="login.html" class="back-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M5 12l7 7M5 12l7-7"/>
        </svg>
        Back to login
      </a>

      <div class="auth-logo">
        <div class="auth-logo-icon">SV</div>
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-subtitle">
          Enter your email address and we'll send you a link to reset your password.
        </p>
      </div>

      <!-- Reset Form -->
      <form id="resetForm" onsubmit="handleReset(event)">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="you@example.com"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg">
          <span id="resetBtnText">Send Reset Link</span>
          <div class="spinner hidden" id="resetSpinner"></div>
        </button>
      </form>

      <!-- Success Message (hidden by default) -->
      <div id="successMessage" class="success-message hidden fade-in">
        <div class="success-icon">✓</div>
        <h2 class="auth-title">Check Your Email</h2>
        <p class="auth-subtitle">
          We've sent a password reset link to <strong id="sentEmail"></strong>.
          Please check your inbox and follow the instructions.
        </p>
        <p class="auth-subtitle">
          Didn't receive the email? <a href="#" onclick="resendEmail(); return false;">Resend</a>
        </p>
      </div>

      <div class="auth-link">
        Remember your password? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    async function handleReset(event) {
      event.preventDefault();

      const email = document.getElementById('email').value;
      const btnText = document.getElementById('resetBtnText');
      const spinner = document.getElementById('resetSpinner');
      const form = document.getElementById('resetForm');

      // Show loading state
      btnText.classList.add('hidden');
      spinner.classList.remove('hidden');
      form.querySelectorAll('input').forEach(input => input.disabled = true);

      try {
        const response = await api.post('/auth/forgot-password', { email });

        if (response.success) {
          // Hide form and show success message
          form.classList.add('hidden');
          document.getElementById('sentEmail').textContent = email;
          document.getElementById('successMessage').classList.remove('hidden');
        }
      } catch (error) {
        // Show error message
        showNotification(error.message || 'Failed to send reset link. Please try again.', 'error');

        // Reset form state
        btnText.classList.remove('hidden');
        spinner.classList.add('hidden');
        form.querySelectorAll('input').forEach(input => input.disabled = false);
      }
    }

    async function resendEmail() {
      const email = document.getElementById('email').value;

      try {
        const response = await api.post('/auth/forgot-password', { email });
        if (response.success) {
          showNotification('Reset link sent again!', 'success');
        }
      } catch (error) {
        showNotification('Failed to resend. Please try again.', 'error');
      }
    }

    function showNotification(message, type) {
      const notification = document.createElement('div');
      notification.className = `alert alert-${type} notification-enter`;
      notification.style.position = 'fixed';
      notification.style.top = '20px';
      notification.style.right = '20px';
      notification.style.zIndex = '9999';
      notification.style.minWidth = '300px';
      notification.innerHTML = `
        <div class="alert-content">
          <div>${message}</div>
        </div>
      `;

      document.body.appendChild(notification);

      setTimeout(() => {
        notification.classList.add('notification-exit');
        setTimeout(() => notification.remove(), 300);
      }, 3000);
    }

    // Check if there's a token in URL for password reset
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (token) {
      // Show new password form instead
      document.getElementById('resetForm').innerHTML = `
        <div class="form-group">
          <label class="form-label" for="newPassword">New Password</label>
          <input
            type="password"
            id="newPassword"
            class="form-input"
            placeholder="Enter new password"
            minlength="8"
            required
          >
        </div>
        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            class="form-input"
            placeholder="Confirm new password"
            minlength="8"
            required
          >
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg">
          <span id="resetBtnText">Reset Password</span>
          <div class="spinner hidden" id="resetSpinner"></div>
        </button>
      `;

      document.querySelector('.auth-subtitle').textContent = 'Enter your new password below.';

      document.getElementById('resetForm').onsubmit = async function(event) {
        event.preventDefault();

        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (newPassword !== confirmPassword) {
          showNotification('Passwords do not match', 'error');
          return;
        }

        const btnText = document.getElementById('resetBtnText');
        const spinner = document.getElementById('resetSpinner');

        btnText.classList.add('hidden');
        spinner.classList.remove('hidden');

        try {
          const response = await api.post('/auth/reset-password', {
            token: token,
            password: newPassword
          });

          if (response.success) {
            showNotification('Password reset successful! Redirecting to login...', 'success');
            setTimeout(() => {
              window.location.href = 'login.html';
            }, 2000);
          }
        } catch (error) {
          showNotification(error.message || 'Failed to reset password', 'error');
          btnText.classList.remove('hidden');
          spinner.classList.add('hidden');
        }
      };
    }
  </script>
</body>
</html>
